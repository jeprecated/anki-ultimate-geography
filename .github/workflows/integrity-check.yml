name: Brain Brew migration check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install legacy dependencies
        run: |
          python -m pip install --upgrade pipenv
          pipenv install
      - name: Validate legacy targets
        run: |
          pipenv run build
          pipenv run build_experimental

  native:
    runs-on: ubuntu-latest
    env:
      BRAINBREW_VERSION: 1.0.0-alpha.4
      EXPECTED_TARGETS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Install Brain Brew
        run: nix shell nixpkgs#cargo nixpkgs#rustc -c cargo install brainbrew --version "=$BRAINBREW_VERSION" --locked
      - name: Verify and export native targets
        run: |
          set -euo pipefail
          rm -rf build/migration-media build/native
          mkdir -p build/migration-media
          cp src/media/flags/* src/media/maps/* src/media/experimental_assets/* build/migration-media/
          brainbrew verify --manifest brainbrew.yaml --all-targets --media-root build/migration-media
          mapfile -t targets < <(brainbrew targets --manifest brainbrew.yaml)
          test "${#targets[@]}" -eq "$EXPECTED_TARGETS"
          for target in "${targets[@]}"; do
            out="build/native/$target"
            brainbrew export crowdanki --manifest brainbrew.yaml --target "$target" --out "$out" --media-root build/migration-media --force
            test -f "$out/deck.json"
          done
