name: Integrity check

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Rust 1.94.0
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - name: Install exact Rust Brain Brew
        run: |
          cargo install brainbrew \
            --git https://github.com/jeprecated/brain-brew.git \
            --rev 1e56a90a42be2522431cd678dfd81617eb4214a6 \
            --locked
          test "$(brainbrew --version)" = 'brainbrew 1.0.0-alpha.8'
      - name: Validate and export all 48 targets
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          python -m unittest -v \
            tests/test_validate_ids.py \
            tests/test_stage_media.py
          python utils/validate_ids.py
          python utils/stage_media.py stage
          python utils/stage_media.py check

          files=(brainbrew.yaml deck.yaml note-types.yaml media.yaml experimental.yaml extended.yaml)
          for file in translation-*.yaml overlays/variants/*/*.yaml; do
            test ! -e "$file" || files+=("$file")
          done
          sha256sum "${files[@]}" > /tmp/brainbrew-yaml.sha256
          for file in "${files[@]}"; do brainbrew fmt "$file"; done
          sha256sum --check /tmp/brainbrew-yaml.sha256

          brainbrew targets --manifest brainbrew.yaml --json > build/brainbrew-targets.json
          python - <<'PY' > build/brainbrew-target-names
          import json
          from pathlib import Path
          for target in json.loads(Path('build/brainbrew-targets.json').read_text())['targets']:
              print(target['name'])
          PY
          diff -u brainbrew-targets.txt build/brainbrew-target-names

          brainbrew media hash --manifest brainbrew.yaml --all-targets \
            --media-root build/brainbrew-media/standard
          sha256sum --check /tmp/brainbrew-yaml.sha256

          mkdir -p build/brainbrew/crowdanki
          while IFS= read -r target; do
            language=${target%-*}
            variant=${target##*-}
            language=$(printf '%s' "$language" | tr '[:lower:]' '[:upper:]')
            directory="Ultimate Geography [$language]"
            case "$variant" in
              experimental) directory="$directory [Experimental]" ;;
              extended) directory="$directory [Extended]" ;;
              standard) ;;
              *) echo "Unknown target variant: $variant" >&2; exit 1 ;;
            esac
            brainbrew validate --manifest brainbrew.yaml --target "$target"
            brainbrew compose --manifest brainbrew.yaml --target "$target" \
              --out "build/brainbrew/$target.yaml"
            brainbrew verify --manifest brainbrew.yaml --target "$target" \
              --media-root build/brainbrew-media/standard
            brainbrew explain --manifest brainbrew.yaml --target "$target" --json \
              > "build/brainbrew/$target-explain.json"
            brainbrew translations --manifest brainbrew.yaml --target "$target" --json \
              > "build/brainbrew/$target-translations.json"
            brainbrew export crowdanki --manifest brainbrew.yaml --target "$target" \
              --media-root build/brainbrew-media/standard \
              --out "build/brainbrew/crowdanki/$directory"
          done < build/brainbrew-target-names

          python - <<'PY'
          import json
          from pathlib import Path

          exports = sorted(Path('build/brainbrew/crowdanki').iterdir())
          assert len(exports) == 48, len(exports)
          for export in exports:
              deck = json.loads((export / 'deck.json').read_text())
              expected_media = 555 if export.name.endswith('[Experimental]') else 550
              expected_templates = 6 if export.name.endswith(('[Extended]', '[Experimental]')) else 4
              declared = deck['media_files']
              actual = {path.name for path in (export / 'media').iterdir()}
              assert len(deck['notes']) == len({note['guid'] for note in deck['notes']}) == 323, export
              assert len(deck['note_models']) == 1, export
              assert len(deck['note_models'][0]['tmpls']) == expected_templates, export
              assert len(declared) == len(set(declared)) == expected_media, export
              assert set(declared) == actual, export
              assert deck['crowdanki_uuid'] and deck['desc'], export
              if '[HE]' in export.name:
                  expected_rtl = [True, True, True, True, True, False, True, False]
                  if export.name.endswith('[Experimental]'):
                      expected_rtl.append(False)
                  assert [field['rtl'] for field in deck['note_models'][0]['flds']] == expected_rtl, export
          PY

          python utils/zip_decks.py
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archives = sorted(Path('build/brainbrew/crowdanki').glob('Ultimate_Geography_*.zip'))
          assert len(archives) == 48, len(archives)
          for archive in archives:
              with ZipFile(archive) as bundle:
                  assert bundle.testzip() is None, archive
                  names = bundle.namelist()
                  assert any(name.endswith('/deck.json') for name in names), archive
                  assert any('/media/' in name for name in names), archive
          PY
