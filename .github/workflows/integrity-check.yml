name: Brain Brew check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BRAINBREW_VERSION: 1.0.0-alpha.4
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install Brain Brew
        run: nix shell nixpkgs#cargo nixpkgs#rustc -c cargo install brainbrew --version "=$BRAINBREW_VERSION" --locked

      - name: Check sparse Experimental region codes
        run: "! grep -nF \"field.region-code: ''\" overlays/variants/experimental.yaml"

      - name: Verify all 48 UG targets
        run: brainbrew verify --manifest brainbrew.yaml --all-targets --media-root media

      - name: Transactionally export all 48 UG targets
        run: |
          set -euo pipefail
          rm -rf build/crowdanki
          mapfile -t targets < <(brainbrew targets --manifest brainbrew.yaml)
          test "${#targets[@]}" -eq 48
          for target in "${targets[@]}"; do
            out="build/crowdanki/$target"
            brainbrew export crowdanki \
              --manifest brainbrew.yaml --target "$target" --out "$out" \
              --media-root media --force
            test -f "$out/deck.json"
          done
