name: Integrity check

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Rust 1.94.0
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
      - name: Install exact Rust Brain Brew
        run: |
          cargo install brainbrew \
            --git https://github.com/jeprecated/brain-brew.git \
            --rev 1e56a90a42be2522431cd678dfd81617eb4214a6 \
            --locked
          test "$(brainbrew --version)" = 'brainbrew 1.0.0-alpha.8'
      - name: Validate and export all 48 targets
        run: |
          export PYTHONDONTWRITEBYTECODE=1
          python -m unittest -v \
            migration/brainbrew/test_certify_full_parity.py \
            migration/brainbrew/test_compare_crowdanki.py \
            migration/brainbrew/test_validate_ids.py \
            migration/brainbrew/test_stage_media.py
          python migration/brainbrew/validate_ids.py
          python migration/brainbrew/stage_media.py stage
          python migration/brainbrew/stage_media.py check

          files=(brainbrew.yaml deck.yaml note-types.yaml media.yaml experimental.yaml extended.yaml)
          for file in translation-*.yaml overlays/variants/*/*.yaml; do
            test ! -e "$file" || files+=("$file")
          done
          sha256sum "${files[@]}" > /tmp/brainbrew-yaml.sha256
          for file in "${files[@]}"; do brainbrew fmt "$file"; done
          sha256sum --check /tmp/brainbrew-yaml.sha256

          brainbrew targets --manifest brainbrew.yaml --json > build/brainbrew-targets.json
          python - <<'PY' > build/brainbrew-target-names
          import json
          from pathlib import Path
          for target in json.loads(Path('build/brainbrew-targets.json').read_text())['targets']:
              print(target['name'])
          PY
          diff -u migration/brainbrew/expected-targets.txt build/brainbrew-target-names

          brainbrew media hash --manifest brainbrew.yaml --all-targets \
            --media-root build/brainbrew-media/standard
          sha256sum --check /tmp/brainbrew-yaml.sha256

          python migration/brainbrew/certify_full_parity.py \
            --brainbrew brainbrew \
            --expected-report migration/brainbrew/full-parity.json \
            --rust-root build/brainbrew \
            --media-root build/brainbrew-media/standard \
            --report build/brainbrew/certification.json
