id: overlay.extension.experimental
kind: extension
field_additions:
  note-type.ultimate-geography:
    fields:
      field.region-code: Region code
    values:
      from_csv:
        - descriptor: src/data/experimental-region.yaml
          parameters: {}
note_types:
  note-type.ultimate-geography:
    intent: merge
    variables:
      variant.name-suffix:
        intent: replace
        value: ' [Experimental]'
        expected_base:
          value: ''
    styling:
      intent: replace
      value: !include 'src/note_models/style_[Experimental].css'
      expected_base:
        value: !include src/note_models/style.css
    card_templates:
      template.country-flag:
        intent: add
        insert_after: template.capital-country
        template:
          name: Country - Flag
          question_format: !include templates/ultimate-geography/country-flag/question.html
          answer_format: !include templates/ultimate-geography/country-flag/answer.html
          adapter_ids: {}
      template.country-map:
        intent: add
        insert_after: template.flag-country
        template:
          name: Country - Map
          question_format: !include templates/ultimate-geography/experimental/country-map/question.html
          answer_format: !include templates/ultimate-geography/experimental/country-map/answer.html
          adapter_ids: {}
media:
  media.interactive-map-config-js:
